x-common-env: &common-env
  env_file:
    - ../.env

services:

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../app:/app/app        # hot-reload in dev
    restart: unless-stopped
    networks: [vigilance]

  # ── Celery workers ──────────────────────────────────────────────────────────
  worker-notifications:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    <<: *common-env
    command: celery -A app.workers.celery_app worker -Q notifications --loglevel=info -c 4
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [vigilance]

  worker-inference:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    <<: *common-env
    command: celery -A app.workers.celery_app worker -Q inference --loglevel=info -c 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [vigilance]

  worker-reports:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    <<: *common-env
    command: celery -A app.workers.celery_app worker -Q reports --loglevel=info -c 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [vigilance]

  # ── Flower (Celery UI) ──────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    <<: *common-env
    command: celery --broker=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//} flower --port=5555
    ports:
      - "5555:5555"
    depends_on: [rabbitmq]
    networks: [vigilance]

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-safevision}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safevision}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vigilance]

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vigilance]

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vigilance]

  # ── MinIO ─────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vigilance]

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on: [api]
    networks: [vigilance]

volumes:
  pg_data:
  redis_data:
  rabbit_data:
  minio_data:

networks:
  vigilance:
    driver: bridge
