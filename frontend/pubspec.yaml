name: detector_epp
description: Sistema Inteligente de Detección de Equipos de Protección Personal.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2

  go_router: ^14.2.7

  http: ^1.2.2

  image_picker: ^1.1.2

  camera: ^0.11.0+2

  flutter_animate: ^4.5.0

  shared_preferences: ^2.3.2

  image: ^4.2.0

  path_provider: ^2.1.4

  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
